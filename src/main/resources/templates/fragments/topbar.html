<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Topbar fragment</title>
  <link rel="stylesheet" href="../../static/css/topbar.css" th:href="@{/css/topbar.css}">
</head>
<body>

<!-- ============================================================
     Reusable topbar fragment.
     Usage:
       <header th:replace="~{fragments/topbar :: topbar(
           'Automatisation DSF', 'Home / Batch DSF',
           '30/09/2022', 'OUVERT', 'NS')}"></header>
     Params: title, crumb, invDate, invStatus ('OUVERT'|'FERMÉ'), initials
     Requires: /css/topbar.css (hamburger works with /js/sidebar.js)
     ============================================================ -->
<header class="topbar"
        th:fragment="topbar(title, crumb, invDate, invStatus, initials)">

  <button type="button" class="topbar-hamburger" data-sidebar-open
          aria-label="Ouvrir le menu">☰</button>

  <div>
    <div class="topbar-crumb" th:text="${crumb} ?: 'Home'">Home / Batch DSF</div>
    <h1 th:text="${title} ?: 'Page'">Automatisation DSF</h1>
  </div>

  <div class="topbar-actions">
    <span class="pill pill-date"
          th:if="${invDate != null}"
          th:text="'📅 Inventaire : ' + ${invDate}">📅 Inventaire : 30/09/2022</span>
    <span class="pill"
          th:if="${invStatus != null}"
          th:classappend="${invStatus == 'OUVERT'} ? 'pill-open' : 'pill-closed'"
          th:text="'● ' + ${invStatus}">● OUVERT</span>

    <!-- User dropdown -->
    <div class="user-menu" data-user-menu>
      <button type="button" class="avatar" data-user-menu-toggle
              aria-haspopup="true" aria-expanded="false"
              aria-label="Menu utilisateur"
              th:text="${initials} ?: 'NS'">NS</button>
      <div class="user-dropdown" role="menu" hidden>
        <div class="user-dropdown-head">
          <span class="user-name" th:text="${#authentication?.name} ?: 'n.souad'">n.souad</span>
          <span class="user-role">Administrateur</span>
        </div>
        <a class="user-dropdown-item" role="menuitem"
           href="../change-password.html" th:href="@{/change-password}">
          <span class="item-icon">🔑</span> Changer le mot de passe
        </a>
        <a class="user-dropdown-item" role="menuitem"
           href="#" th:href="@{/profile}">
          <span class="item-icon">👤</span> Mon profil
        </a>
        <div class="user-dropdown-sep" role="separator"></div>
        <form method="post" action="#" th:action="@{/logout}">
          <button type="submit" class="user-dropdown-item danger" role="menuitem">
            <span class="item-icon">⏻</span> Logout
          </button>
        </form>
      </div>
    </div>
  </div>
</header>

<script src="../../static/js/topbar.js" th:src="@{/js/topbar.js}" defer></script>
</body>
</html>
